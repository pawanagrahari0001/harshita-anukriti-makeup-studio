<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Harshita Anukriti Makeup Studio</title>
    <meta name="description" content="Luxury bridal makeup and professional makeup training by Harshita Anukriti." />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blush: "#F3DDD4",
                        ivory: "#FAF7F3",
                        champagne: "#C8A27A",
                        nude: "#E8C6B8",
                        textdark: "#2A2A2A",
                        textmuted: "#6F6A66",
                    },
                    borderRadius: {
                        xl: "24px",
                    },
                    fontFamily: {
                        serif: ["Playfair Display", "serif"],
                        sans: ["Poppins", "sans-serif"],
                    }
                }
            }
        }
    </script>

    <!-- Page Transition -->
    <style>
        body {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        body.page-loaded {
            opacity: 1;
        }
    </style>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/global.css">
</head>

<body class="bg-blush font-sans text-textdark">

    <!-- HEADER -->
    <div id="header"></div>

    <!-- FULL SCREEN HERO -->
    <section class="relative w-full min-h-[calc(100vh-96px)] overflow-hidden">

        <!-- Swiper -->
        <div class="swiper heroSwiper absolute inset-0 z-0">
            <div class="swiper-wrapper">

                <div class="swiper-slide relative">
                    <img src="images/hero/hero-1.png" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-black/40"></div>
                </div>

                <div class="swiper-slide relative">
                    <img src="images/hero/hero-4.jpg" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-black/40"></div>
                </div>

            </div>
        </div>

        <!-- HERO CONTENT -->
        <div class="relative z-10 max-w-7xl mx-auto min-h-[calc(100vh-96px)] px-6 flex items-center pt-12">

            <div class="grid md:grid-cols-2 gap-12 w-full">

                <!-- LEFT TEXT -->
                <div class="text-white" data-aos="fade-right">
                    <h1 class="text-4xl md:text-6xl font-serif leading-tight">
                        Timeless Bridal Makeup <br />
                        & Professional Training
                    </h1>

                    <p class="mt-6 text-white/80 max-w-lg">
                        Luxury bridal artistry and expert makeup education crafted
                        with elegance and precision.
                    </p>

                    <div class="mt-8 flex gap-4 flex-wrap">
                        <a href="contact.html"
                            class="bg-champagne text-white px-7 py-3 rounded-full hover:shadow-xl transition">
                            Book Bridal Makeup
                        </a>

                        <a href="contact.html"
                            class="border border-white text-white px-7 py-3 rounded-full hover:bg-white hover:text-textdark transition">
                            Join Makeup Training
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 900 });
    </script>

    <!-- Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        new Swiper(".heroSwiper", {
            loop: true,
            effect: "fade",
            autoplay: {
                delay: 4500,
                disableOnInteraction: false
            },
            speed: 1200
        });
    </script>

    <!-- Page Transition + Header/Footer -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("page-loaded");
        });

        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", function (e) {
                const url = this.getAttribute("href");
                if (
                    url &&
                    !url.startsWith("#") &&
                    !this.hasAttribute("target") &&
                    this.origin === window.location.origin
                ) {
                    e.preventDefault();
                    document.body.classList.remove("page-loaded");
                    setTimeout(() => window.location.assign(url), 300);
                }
            });
        });

        fetch("header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header").innerHTML = data);

        fetch("footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>

    <script>
        // Mobile menu toggle (GLOBAL)
        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            if (!menu) return;
            menu.classList.toggle("hidden");
        }
    </script>


</body>

</html>
